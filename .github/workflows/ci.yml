name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: gcc
      - name: Node version
        run: node --version
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSKYCUE_WERROR=ON -DSKYCUE_UI_TESTS=OFF
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE 'needs-test-data|slow'
      - name: ccache statistics
        if: always()
        run: ccache -s

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          packages: clang
          ccache-key: clang-asan
      - name: AddressSanitizer and UBSan suite
        # Exit status 77 means the script skipped itself; any other failure fails the job.
        run: scripts/dev/run-sanitizers.sh asan || [ $? -eq 77 ]
      - name: ccache statistics
        if: always()
        run: ccache -s
