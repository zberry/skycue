name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: gcc
      - name: Node version
        run: node --version
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSKYCUE_WERROR=ON -DSKYCUE_UI_TESTS=OFF
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE 'needs-test-data|slow'
      - name: ccache statistics
        if: always()
        run: ccache -s

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          packages: clang
          ccache-key: clang-asan
      - name: AddressSanitizer and UBSan suite
        # Exit status 77 means the script skipped itself; any other failure fails the job.
        run: scripts/dev/run-sanitizers.sh asan || [ $? -eq 77 ]
      - name: ccache statistics
        if: always()
        run: ccache -s

  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
        with:
          packages: libncurses-dev libzstd-dev libboost-regex-dev libboost-filesystem-dev libsoapysdr-dev
          ccache-key: gcc-testdata
      - name: Cache fetched captures
        id: captures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/test-captures
          key: captures-${{ hashFiles('scripts/test-data/fetch-test-captures.sh', 'scripts/test-data/fetch-iq-samples.sh') }}
      - name: Fetch test captures
        run: SKYCUE_FETCH_IQ=1 scripts/test-data/fetch-test-captures.sh --cache build/test-captures
      - name: Cache reference decoders
        id: decoders
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/reference-decoders
          key: decoders-${{ hashFiles('scripts/dev/build-reference-decoders.sh') }}
      - name: Build reference decoders
        if: steps.decoders.outputs.cache-hit != 'true'
        run: scripts/dev/build-reference-decoders.sh build/reference-decoders
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSKYCUE_UI_TESTS=OFF -DSKYCUE_TEST_READSB=$PWD/build/reference-decoders/bin/readsb
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        env:
          SKYCUE_READSB: ${{ github.workspace }}/build/reference-decoders/bin/readsb
          SKYCUE_DUMP978: ${{ github.workspace }}/build/reference-decoders/bin/dump978-fa
        run: ctest --test-dir build -L needs-test-data --output-on-failure --output-log build/test-data.log
      - name: Fresh references were used
        run: |
          grep -q 'run (b): fresh readsb golden made' build/test-data.log
          grep -q 'run (b): fresh dump978-fa golden made' build/test-data.log
      - name: ccache statistics
        if: always()
        run: ccache -s
