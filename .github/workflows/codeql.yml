name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    # CodeQL is free only on public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: c-cpp
          build-mode: manual
      - uses: ./.github/actions/setup-build
        with:
          ccache-key: gcc-codeql
      - name: Configure
        # The empty launcher overrides the ccache one from setup-build: every file must be
        # compiled for real so that CodeQL's tracer sees it.
        run: cmake -S . -B build -G Ninja -DSKYCUE_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:c-cpp
