<svg xmlns="http://www.w3.org/2000/svg" style="color:#e6e4de" viewBox="0 0 1360 560" role="img" aria-label="Source programs and devices on the left feed seven input kinds; the inputs feed the hub's raw tap, which copies raw messages to raw outputs and hands frames, lines and texts to the decoders and parsers; their observations reach the engine, whose filtered tracks go to the cue stream, the web interface, the recorder and the statistics store; FIS-B uplinks are decoded separately into the web interface." font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="currentColor">
  <rect x="0" y="0" width="1360" height="560" fill="#15181c"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arr-raw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a24a"/>
    </marker>
  </defs>

  <!-- sources: the programs and devices that produce each input kind -->
  <text x="16" y="30" fill="#a0a7b0" font-size="11" font-weight="600" letter-spacing="0.06em">SOURCES</text>
  <g stroke="currentColor" stroke-width="1" fill="#1d2127">
    <rect x="16" y="48" width="192" height="44" rx="3"/>
    <rect x="16" y="104" width="192" height="44" rx="3"/>
    <rect x="16" y="160" width="192" height="44" rx="3"/>
    <rect x="16" y="216" width="192" height="44" rx="3"/>
    <rect x="16" y="272" width="192" height="44" rx="3"/>
  </g>
  <g stroke="currentColor" stroke-width="1" fill="#1d2127" stroke-dasharray="2 3">
    <rect x="16" y="340" width="192" height="44" rx="3"/>
    <rect x="16" y="396" width="192" height="44" rx="3"/>
    <rect x="16" y="452" width="192" height="44" rx="3"/>
  </g>
  <g font-size="12">
    <text x="26" y="66" font-weight="600">readsb</text><text x="26" y="82" fill="#a0a7b0" font-size="11">JSON port 30047 · Beast port 30005</text>
    <text x="26" y="122" font-weight="600">dump1090-fa, PiAware</text><text x="26" y="138" fill="#a0a7b0" font-size="11">dump1090-mutability · Beast 30005</text>
    <text x="26" y="178" font-weight="600">Beast hardware</text><text x="26" y="194" fill="#a0a7b0" font-size="11">Mode-S Beast · Radarcape · a splitter</text>
    <text x="26" y="234" font-weight="600">dump978-fa</text><text x="26" y="250" fill="#a0a7b0" font-size="11">raw port 30978</text>
    <text x="26" y="290" font-weight="600">uAvionix pingStation 3</text><text x="26" y="306" fill="#a0a7b0" font-size="11">JSON texts, or ASTERIX mode</text>
    <text x="26" y="358" font-weight="600">skycue-rawplay</text><text x="26" y="374" fill="#a0a7b0" font-size="11">plays raw-* captures (rawrec)</text>
    <text x="26" y="414" font-weight="600">skycue-pingsim</text><text x="26" y="430" fill="#a0a7b0" font-size="11">a pingStation without hardware</text>
    <text x="26" y="470" font-weight="600">received-*.jsonl</text><text x="26" y="486" fill="#a0a7b0" font-size="11">skycued's own recordings</text>
  </g>
  <!-- sources -> inputs (inputs column starts at x=256 after the shift) -->
  <g stroke="currentColor" stroke-width="1.2" fill="none" marker-end="url(#arr)">
    <path d="M208,62 L256,66"/>
    <path d="M208,80 L232,80 L232,118 L256,118"/>
    <path d="M208,126 L256,126"/>
    <path d="M208,182 L232,182 L232,134 L256,134"/>
    <path d="M208,230 L232,230 L232,182 L256,182"/>
    <path d="M208,246 L256,238"/>
    <path d="M208,290 L256,294"/>
    <path d="M208,302 L232,302 L232,350 L256,350"/>
  </g>
  <g stroke="currentColor" stroke-width="1.2" fill="none" stroke-dasharray="2 3" marker-end="url(#arr)">
    <path d="M208,354 L224,354 L224,142 L256,142"/>
    <path d="M208,370 L240,370 L240,246 L256,246"/>
    <path d="M208,418 L240,418 L240,302 L256,302"/>
    <path d="M208,474 L232,474 L232,406 L256,406"/>
  </g>

  <g transform="translate(240,0)">
  <!-- column headers -->
  <g fill="#a0a7b0" font-size="11" font-weight="600" letter-spacing="0.06em">
    <text x="16" y="30">INPUTS</text>
    <text x="300" y="30">HUB</text>
    <text x="490" y="30">DECODE / PARSE</text>
    <text x="750" y="30">ENGINE</text>
    <text x="1000" y="30">OUTPUTS</text>
  </g>

  <!-- inputs -->
  <g stroke="currentColor" stroke-width="1" fill="#1d2127">
    <rect x="16" y="48" width="224" height="44" rx="3"/>
    <rect x="16" y="104" width="224" height="44" rx="3"/>
    <rect x="16" y="160" width="224" height="44" rx="3"/>
    <rect x="16" y="216" width="224" height="44" rx="3"/>
    <rect x="16" y="272" width="224" height="44" rx="3"/>
    <rect x="16" y="328" width="224" height="44" rx="3"/>
    <rect x="16" y="384" width="224" height="44" rx="3"/>
  </g>
  <g font-size="12">
    <text x="28" y="66" font-weight="600">readsb</text><text x="28" y="82" fill="#a0a7b0" font-size="11">JSON positions · built in</text>
    <text x="28" y="122" font-weight="600">beast_raw</text><text x="28" y="138" fill="#a0a7b0" font-size="11">Mode S / ADS-B frames, 1090 MHz</text>
    <text x="28" y="178" font-weight="600">dump978</text><text x="28" y="194" fill="#a0a7b0" font-size="11">UAT raw lines · built in</text>
    <text x="28" y="234" font-weight="600">uat_raw</text><text x="28" y="250" fill="#a0a7b0" font-size="11">UAT raw lines, 978 MHz</text>
    <text x="28" y="290" font-weight="600">pingstation_json</text><text x="28" y="306" fill="#a0a7b0" font-size="11">uAvionix pingStation 3 texts</text>
    <text x="28" y="346" font-weight="600">pingstation_cat021</text><text x="28" y="362" fill="#a0a7b0" font-size="11">ASTERIX CAT021 blocks</text>
    <text x="28" y="402" font-weight="600">replay</text><text x="28" y="418" fill="#a0a7b0" font-size="11">a skycue recording</text>
  </g>
  <text x="16" y="458" fill="#a0a7b0" font-size="11">every input: TCP client · TCP server · UDP unicast or multicast</text>
  <text x="16" y="476" fill="#a0a7b0" font-size="11">any number of each kind, managed in the web page or the inputs file</text>

  <!-- hub -->
  <rect x="300" y="48" width="130" height="380" rx="3" fill="#3a2e14" stroke="#d6a24a"/>
  <text x="365" y="228" text-anchor="middle" font-weight="600">raw tap</text>
  <text x="365" y="246" text-anchor="middle" font-size="11" fill="#a0a7b0">before parsing</text>
  <text x="365" y="262" text-anchor="middle" font-size="11" fill="#a0a7b0">arrival order</text>

  <!-- inputs -> hub -->
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="240" y1="70" x2="300" y2="70"/>
    <line x1="240" y1="126" x2="300" y2="126"/>
    <line x1="240" y1="182" x2="300" y2="182"/>
    <line x1="240" y1="238" x2="300" y2="238"/>
    <line x1="240" y1="294" x2="300" y2="294"/>
    <line x1="240" y1="350" x2="300" y2="350"/>
    <line x1="240" y1="406" x2="300" y2="406"/>
  </g>

  <!-- raw outputs -->
  <rect x="490" y="48" width="200" height="56" rx="3" fill="#3a2e14" stroke="#d6a24a"/>
  <text x="502" y="68" font-weight="600">Raw outputs</text>
  <text x="502" y="86" font-size="11" fill="#a0a7b0">beast · uat · json · pingstation · cat021</text>
  <line x1="430" y1="76" x2="490" y2="76" stroke="#d6a24a" stroke-width="1.4" marker-end="url(#arr-raw)"/>
  <text x="460" y="68" text-anchor="middle" font-size="10" fill="#d6a24a">copies</text>

  <!-- decoders / parsers -->
  <g stroke="currentColor" stroke-width="1" fill="#1d2127">
    <rect x="490" y="136" width="200" height="44" rx="3"/>
    <rect x="490" y="192" width="200" height="44" rx="3"/>
    <rect x="490" y="248" width="200" height="58" rx="3"/>
    <rect x="490" y="330" width="200" height="44" rx="3"/>
  </g>
  <text x="502" y="154" font-weight="600">ModesDecoder</text><text x="502" y="170" font-size="11" fill="#a0a7b0">1090: CPR, velocity, identity, GNSS−baro</text>
  <text x="502" y="210" font-weight="600">UatDecoder</text><text x="502" y="226" font-size="11" fill="#a0a7b0">978: state vector, mode status, AUX</text>
  <text x="502" y="266" font-weight="600">Parsers</text><text x="502" y="282" font-size="11" fill="#a0a7b0">readsb JSON · pingStation JSON</text><text x="502" y="296" font-size="11" fill="#a0a7b0">CAT021 · replay</text>
  <text x="502" y="348" font-weight="600">FIS-B decoder</text><text x="502" y="364" font-size="11" fill="#a0a7b0">978 uplinks: weather, TWGO</text>

  <!-- hub -> decoders -->
  <g stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)">
    <line x1="430" y1="158" x2="490" y2="158"/>
    <line x1="430" y1="214" x2="490" y2="214"/>
    <line x1="430" y1="277" x2="490" y2="277"/>
    <line x1="430" y1="352" x2="490" y2="352"/>
  </g>
  <g font-size="10" fill="#a0a7b0" text-anchor="middle">
    <text x="460" y="150">frames</text>
    <text x="460" y="206">lines</text>
    <text x="460" y="269">texts</text>
    <text x="460" y="344">uplinks</text>
  </g>

  <!-- engine -->
  <rect x="750" y="136" width="200" height="250" rx="3" fill="#163640" stroke="#5fb8d2"/>
  <text x="762" y="156" font-weight="600">Track table</text>
  <text x="762" y="172" font-size="11" fill="#a0a7b0">keyed by address + address type</text>
  <g font-size="11">
    <text x="762" y="198">block list, then allow list</text>
    <text x="762" y="216">no position → never sent</text>
    <text x="762" y="234">range &gt; max_range_nm</text>
    <text x="762" y="252">elevation &lt; min_elevation_deg</text>
    <text x="762" y="270">geometric altitude estimate</text>
    <text x="762" y="288">pacing: min / max interval</text>
    <text x="762" y="306">keyframes every N s</text>
    <text x="762" y="324">track_timeout → drop</text>
  </g>
  <text x="762" y="356" font-size="11" fill="#a0a7b0">one engine, all inputs merged</text>

  <!-- decoders -> engine -->
  <g stroke="#5fb8d2" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="690" y1="158" x2="750" y2="158"/>
    <line x1="690" y1="214" x2="750" y2="214"/>
    <line x1="690" y1="277" x2="750" y2="277"/>
  </g>
  <text x="720" y="206" text-anchor="middle" font-size="10" fill="#5fb8d2">observations</text>

  <!-- fisb -> store -->
  <rect x="750" y="410" width="200" height="44" rx="3" fill="#1d2127" stroke="currentColor"/>
  <text x="762" y="428" font-weight="600">FIS-B store</text><text x="762" y="444" font-size="11" fill="#a0a7b0">current products until they expire</text>
  <path d="M690,352 L720,352 L720,432 L750,432" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- outputs -->
  <g stroke="currentColor" stroke-width="1" fill="#1d2127">
    <rect x="1000" y="136" width="110" height="56" rx="3"/>
    <rect x="1000" y="204" width="110" height="56" rx="3"/>
    <rect x="1000" y="272" width="110" height="68" rx="3"/>
    <rect x="1000" y="352" width="110" height="44" rx="3"/>
  </g>
  <text x="1010" y="154" font-weight="600">Cue stream</text><text x="1010" y="170" font-size="11" fill="#a0a7b0">TCP listen · dial</text><text x="1010" y="184" font-size="11" fill="#a0a7b0">UDP targets</text>
  <text x="1010" y="222" font-weight="600">Web page</text><text x="1010" y="238" font-size="11" fill="#a0a7b0">HTTP API</text><text x="1010" y="252" font-size="11" fill="#a0a7b0">WebSocket</text>
  <text x="1010" y="290" font-weight="600">Recorder</text><text x="1010" y="306" font-size="11" fill="#a0a7b0">received · sent</text><text x="1010" y="320" font-size="11" fill="#a0a7b0">fisb · raw-&lt;id&gt;</text><text x="1010" y="334" font-size="11" fill="#a0a7b0">jsonl · csv</text>
  <text x="1010" y="370" font-weight="600">Stats store</text><text x="1010" y="386" font-size="11" fill="#a0a7b0">series · coverage</text>

  <!-- engine -> outputs -->
  <g stroke="#5fb8d2" stroke-width="1.4" marker-end="url(#arr)">
    <line x1="950" y1="164" x2="1000" y2="164"/>
    <line x1="950" y1="232" x2="1000" y2="232"/>
    <line x1="950" y1="300" x2="1000" y2="300"/>
    <line x1="950" y1="374" x2="1000" y2="374"/>
  </g>
  <text x="975" y="156" text-anchor="middle" font-size="10" fill="#5fb8d2">tracks</text>
  <text x="975" y="292" text-anchor="middle" font-size="10" fill="#5fb8d2">sent</text>
  <!-- fisb store -> web -->
  <path d="M950,432 L975,432 L975,250 L1000,250" fill="none" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- received stream: parsers -> recorder, dashed -->
  <path d="M690,300 L730,300 L730,400 L985,400 L985,320 L1000,320" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="860" y="394" text-anchor="middle" font-size="10" fill="#a0a7b0">received stream: every observation, before filtering</text>

  <!-- legend-ish footer -->
  <g font-size="11">
    <line x1="16" y1="520" x2="46" y2="520" stroke="#d6a24a" stroke-width="1.4"/><text x="54" y="524">raw messages, unparsed and unfiltered</text>
    <line x1="300" y1="520" x2="330" y2="520" stroke="#5fb8d2" stroke-width="1.4"/><text x="338" y="524">aircraft observations and tracks</text>
    <line x1="560" y1="520" x2="590" y2="520" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/><text x="598" y="524">recording of everything parsed</text>
    <line x1="800" y1="520" x2="830" y2="520" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3"/><text x="838" y="524">test and replay feeders, not live radio</text>
  </g>
  </g>
</svg>
